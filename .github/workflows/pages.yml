name: Deploy Frontend Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build with GitHub Pages base
        env:
          VITE_API_URL: https://n-ai-chat-v2.onrender.com
        run: npm run build -- --base=/N-AI-CHAT-V2/
      - name: Verify built assets
        run: |
          test -f dist/index.html
          test -d dist/assets
          grep -q '/N-AI-CHAT-V2/assets/' dist/index.html
          if grep -q 'src/main.jsx' dist/index.html; then
            echo "ERROR: Vite source file leaked into deployed HTML"
            exit 1
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
