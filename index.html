<!doctype html>
<html lang="mg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="N-AI Chat V2 — Assistant IA intelligent, sécurisé et futuriste." />
    <meta name="theme-color" content="#050816" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>N-AI Chat V2</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #050816; color: #eaf4ff; font-family: system-ui, sans-serif; }
      #boot-status { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box; }
      #boot-status strong { color: #80dfff; font-size: 22px; }
      #boot-status p { color: #a9b9d3; font-size: 14px; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-status" role="status"><div><strong>N-AI Chat V2</strong><p>Misokatra ny application...</p></div></div>
    </div>
    <script>
      window.addEventListener("error", function (event) {
        var root = document.getElementById("root");
        if (root && root.querySelector("#boot-status")) {
          root.innerHTML = '<div id="boot-status"><div><strong>N-AI Chat V2</strong><p>Tsy tafiditra ny application. Avereno havaozina ny pejy; raha mbola misy olana, jereo ny GitHub Actions deployment.</p></div></div>';
        }
      });
      window.setTimeout(function () {
        var status = document.getElementById("boot-status");
        if (status) status.querySelector("p").textContent = "Mbola miandry ny application. Raha tsy misokatra dia havaozy ny pejy.";
      }, 10000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
